description=零号区、仓库区、农场镇各三处租还站点。骑行消除负重减速并加速（默认x1.5），禁止战斗与食药。200元/小时，不足一小时按一小时计费；死亡另赔2000元。未还车禁止撤离，欠费禁止再租；还车/报失时自动扣款，余额不足可在站点或马蜂自提点补付。F5付费召车（¥100，车从最近站点赶来），F6租还，F7上下车，F8报失，F9诊断。1.0.5/1.0.6：骑行加速x1.5、模型美化；1.0.7：自动扣款；1.0.8：付费召车+程序合成音效；1.0.9：修复召车后车辆被立即回收；1.0.10：召车改为3秒送达，修复提示音静默；1.0.11：车身黑化改造（磨损铁架、余烬轮圈、机械骷髅徽记、编号牌照）。代码使用AI辅助开发。
