displayName=共享单车
description=在地图上租一辆共享单车骑着走。零号区四处、仓库区五处、农场镇六处租还站点（共十五处），走到站点按 F6 租车或还车。骑起来会解除负重的减速、移速提到 x1.5，代价是骑行时不能开火也不能吃东西喝药。200 元一小时，不足一小时按一小时算，摔死另赔 2000 元。没还车不能撤离，欠着车费不能续租；还车或报失时会自动扣款，余额不够可以到任意站点或马蜂自提点补付。F5 付费召车（100 元，3 秒从最近站点送到你面前），F 上下车，F8 报失，F9 打开诊断面板。1.0.17 更新：站点从九处加密到十五处，农场镇六处、仓库区五处、零号区四处，长距离跑图不用再走回头路。1.0.16 更新：修好了车就在眼前却上不去的问题，上下车改用 F 键，骑行中受伤立刻下车，地图上的站点标记换成八角牌徽章。
